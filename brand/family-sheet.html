<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpsDevCode family sheet</title>
    <style>
      body {
        margin: 0;
        background: #f3efe6;
        color: #1a1f1c;
        font-family: 'IBM Plex Sans', ui-sans-serif, sans-serif;
        padding: 48px;
      }
      h1 {
        font-family: 'IBM Plex Serif', Georgia, serif;
        font-weight: 400;
        font-size: 28px;
      }
      .row {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
        align-items: center;
        margin: 32px 0;
      }
      .row img {
        width: 64px;
        height: 64px;
      }
      .lockup img {
        width: 280px;
        height: auto;
      }
      .section {
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <h1>Family test</h1>
    <div class="row">
      <img src="svg/mark-opsdevcode.svg" alt="OpsDevCode" />
      <img src="svg/mark-repave.svg" alt="Repave" />
      <img src="svg/mark-overpass.svg" alt="Overpass" />
      <img src="svg/mark-toll.svg" alt="Toll" />
      <img src="svg/mark-dispatch.svg" alt="Dispatch" />
    </div>
    <h1>Independence test</h1>
    <div class="row">
      <img src="svg/mark-repave.svg" alt="" />
      <img src="svg/mark-overpass.svg" alt="" />
      <img src="svg/mark-toll.svg" alt="" />
      <img src="svg/mark-dispatch.svg" alt="" />
    </div>
    <h1>Endorsement lockups</h1>
    <div class="row lockup">
      <img src="svg/lockup-opsdevcode.svg" alt="" />
      <img src="svg/lockup-repave.svg" alt="" />
      <img src="svg/lockup-overpass.svg" alt="" />
      <img src="svg/lockup-toll.svg" alt="" />
      <img src="svg/lockup-dispatch.svg" alt="" />
    </div>
    <h1>Signature section</h1>
    <img class="section" src="svg/section-system.svg" alt="Governed section" />
  </body>
</html>
